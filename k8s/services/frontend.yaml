apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-frontend
  namespace: matrix-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-frontend
  template:
    metadata:
      labels:
        app: matrix-frontend
    spec:
      containers:
        - name: matrix-frontend
          image: narayana345/matrix-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-frontend
  namespace: matrix-core
spec:
  type: NodePort
  selector:
    app: matrix-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
# k8s/infra/core-network-policies.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-only
  namespace: matrix-core
spec:
  podSelector: {} # Applies to all pods in matrix-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix-core

---
# 2. NEW POLICY: Allow Previews to talk to MinIO (for file storage)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-previews-to-minio
  namespace: matrix-core
spec:
  # Target ONLY the MinIO pod (adjust matchLabels if your MinIO pod label is different)
  podSelector: 
    matchLabels:
      app: minio # or statefulset.kubernetes.io/pod-name: minio-0
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic FROM the matrix-previews namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: matrix-previews
      # ONLY on port 9000
      ports:
        - protocol: TCP
          port: 9000

---
# 3. Allow public NodePort/Tailscale traffic to reach the public-facing services.
# This cluster exposes these pods directly via NodePort (no ingress-nginx controller
# is deployed here), so the external entry point IS 0.0.0.0/0, not an ingress namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-nodeport
  namespace: matrix-core
spec:
  # This applies to the services exposed externally via NodePort
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api-gateway", "matrix-me-proxy", "matrix-frontend"] # Add any other services that need to be exposed externally
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
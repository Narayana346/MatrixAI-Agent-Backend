# k8s/stateful/qwen-coder-model-runner.yaml
#
# Docker Model Runner (DMR) running Llama-3.1-8B-Instruct. Exposes an
# OpenAI-compatible API under /engines/v1 on port 80. Despite the resource
# names (kept from the original Qwen Coder setup), it no longer serves Qwen:
# Qwen2.5-Coder-7B and Hermes-2-Pro-Llama-3-8B were both tried for real
# function/tool-calling and don't reliably return a structured tool_calls
# response from this llama.cpp build — Llama-3.1's chat template is the one
# with working {% if tools %} support. See LocalModelProperties for details.
#
# IMPORTANT: Llama-3.1's GGUF declares a 131072-token native context, which
# DMR sizes the KV cache to directly from the file (~16GiB) — enough to OOM
# this pod outright. The cached blob on the PVC has had its embedded
# llama.context_length metadata binary-patched to 32768 to fix this (patched
# in place at /models/bundles/sha256/<hash>/model/model.gguf, offset found by
# parsing the GGUF header). If this blob is ever deleted/re-pulled, the patch
# is lost and must be reapplied by hand before the pod will run safely.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-coder-model-runner-init
  namespace: matrix-core
data:
  models: |
    hf.co/unsloth/Llama-3.1-8B-Instruct-GGUF:Q4_K_M
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-coder-model-storage
  namespace: matrix-core
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-coder-model-runner
  namespace: matrix-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-coder-model-runner
  template:
    metadata:
      labels:
        app: qwen-coder-model-runner
    spec:
      initContainers:
        - name: changeowner
          image: busybox
          command: ["sh", "-c", "chmod a+rwx /models"]
          volumeMounts:
            - name: model-storage
              mountPath: /models

      containers:
        - name: model-runner
          image: docker/model-runner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 12434
          volumeMounts:
            - name: model-storage
              mountPath: /models
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 1000m
              memory: 8Gi
            limits:
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /engines/status
              port: 12434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /engines/status
              port: 12434
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3

        # Pre-pulls the model listed in the ConfigMap on startup so the
        # main container doesn't have to download it on first request.
        - name: model-init
          image: curlimages/curl:8.14.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              MODEL_RUNNER=http://localhost:12434
              echo "Pre-pulling models..."
              while IFS= read -r model; do
                if [ -n "$model" ]; then
                  echo "Pulling model: $model"
                  curl -d "{\"from\": \"$model\"}" "$MODEL_RUNNER"/models/create
                fi
              done < /config/models
              echo "Model pre-pull complete"
              tail -f /dev/null
          volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: init-config
              mountPath: /config

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: qwen-coder-model-storage
        - name: init-config
          configMap:
            name: qwen-coder-model-runner-init
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-coder-model-runner
  namespace: matrix-core
spec:
  selector:
    app: qwen-coder-model-runner
  ports:
    - port: 80
      targetPort: 12434

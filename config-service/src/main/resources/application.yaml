spring:
  application:
    name: config-service

  cloud:
    config.server.git:
      uri: git@github.com:Narayana346/MatrixAi-Agent-Configuration.git
      default-label: main
      clone-on-start: true
      force-pull: true
      ignore-local-ssh-settings: true
      strict-host-key-checking: false

server.port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false
    config.server.git:
      uri: git@github.com:Narayana346/MatrixAi-Agent-Configuration.git
      clone-on-start: true
      force-pull: true
      ignore-local-ssh-settings: true
      strict-host-key-checking: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
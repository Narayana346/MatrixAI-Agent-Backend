apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: matrix-previews
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
      status: idle
  template:
    metadata:
      labels:
        app: runner
        status: idle
    spec:
      # Without this, the host's default AppArmor profile silently blocks signal
      # delivery between processes in the same container (confirmed earlier on
      # pgvector — same root cause) — it would otherwise randomly break the
      # nohup/background-process management this pod relies on (npm run dev, mc
      # mirror --watch).
      securityContext:
        appArmorProfile:
          type: Unconfined
      volumes:
        - name: workspace
          emptyDir: {}
      containers:
        # 1. THE RUNNER (Vite / Node.js)
        - name: runner
          image: node:20-alpine
          workingDir: /app
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /app
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

        # 2. THE SYNCER (MinIO mc client).
        # minio/mc was discontinued on Docker Hub (and MinIO's direct binary
        # downloads were also pulled, 410 Gone) — narayana345/mc-client is `mc`
        # built directly from the official github.com/minio/mc source via
        # `go install`, since no official pre-built image remains available.
        - name: syncer
          image: narayana345/mc-client:latest
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ROOT_PASSWORD
            # Constructing the host URL for the internal MinIO service
            - name: MC_HOST_myminio
              value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.matrix-core.svc.cluster.local:9000"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"